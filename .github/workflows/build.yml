name: Build smoketest

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BOOTLIN_VERSION: "2025.08-1"
  BOOTLIN_DIR: armv7-eabihf--glibc--bleeding-edge-2025.08-1

jobs:
  build-linux:
    name: Linux (Bootlin GCC)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Cache Bootlin toolchain
        uses: actions/cache@v4
        id: toolchain-cache
        with:
          path: ${{ github.workspace }}/.toolchains/${{ env.BOOTLIN_DIR }}
          key: bootlin-${{ env.BOOTLIN_DIR }}

      - name: Install Bootlin toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ github.workspace }}/.toolchains"
          curl -fsSL "https://toolchains.bootlin.com/downloads/releases/toolchains/armv7-eabihf/tarballs/${{ env.BOOTLIN_DIR }}.tar.xz" | \
            tar -xJC "${{ github.workspace }}/.toolchains"

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bc flex bison libssl-dev libelf-dev

      - name: Test build contract and complete demo-cart gate
        run: |
          export PATH="${{ github.workspace }}/.toolchains/${{ env.BOOTLIN_DIR }}/bin:$PATH"
          make test CART_CROSS_CC=arm-linux-gcc

      - name: Configure kernel
        working-directory: linux_vita
        run: |
          export PATH="${{ github.workspace }}/.toolchains/${{ env.BOOTLIN_DIR }}/bin:$PATH"
          make ARCH=arm CROSS_COMPILE=arm-linux- vita_defconfig
          # No initramfs in CI — rootfs.cpio.zst is not in the repo
          sed -i 's|^CONFIG_INITRAMFS_SOURCE=.*|CONFIG_INITRAMFS_SOURCE=""|' .config
          make ARCH=arm CROSS_COMPILE=arm-linux- olddefconfig

      - name: Build device trees
        run: |
          export PATH="${{ github.workspace }}/.toolchains/${{ env.BOOTLIN_DIR }}/bin:$PATH"
          make dtb CROSS_COMPILE=arm-linux-

      - name: Verify outputs
        run: |
          make verify-dtb
          echo "Build successful"

      - name: Build zImage
        run: |
          export PATH="${{ github.workspace }}/.toolchains/${{ env.BOOTLIN_DIR }}/bin:$PATH"
          make build CROSS_COMPILE=arm-linux-
          make stage CROSS_COMPILE=arm-linux-

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zimage-bootlin
          # staged by `make stage` - CI must not know the kernel's internal layout
          path: dist/ci/
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: macOS (LLVM/Clang)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Install dependencies
        run: brew install llvm lld libelf make findutils gnu-sed

      - name: Configure kernel
        working-directory: linux_vita
        run: |
          export PATH="$(brew --prefix findutils)/libexec/gnubin:$(brew --prefix gnu-sed)/libexec/gnubin:$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          gmake ARCH=arm LLVM=1 \
            HOSTCFLAGS="-Iscripts/macos-include -I$(brew --prefix libelf)/include" \
            vita_defconfig
          # No initramfs in CI — rootfs.cpio.zst is not in the repo
          sed -i 's|^CONFIG_INITRAMFS_SOURCE=.*|CONFIG_INITRAMFS_SOURCE=""|' .config
          gmake ARCH=arm LLVM=1 \
            HOSTCFLAGS="-Iscripts/macos-include -I$(brew --prefix libelf)/include" \
            olddefconfig

      - name: Build device trees
        run: |
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          gmake dtb

      - name: Verify outputs
        run: |
          gmake verify-dtb
          echo "Build successful"

  build-loader:
    name: Loader (VitaSDK)
    runs-on: ubuntu-24.04
    container:
      image: vitasdk/vitasdk:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Build loader payload
        working-directory: vita-baremetal-linux-loader
        run: |
          make
          ls -l vita-baremetal-linux-loader.bin
          sha256sum vita-baremetal-linux-loader.bin

      - name: Upload loader payload
        uses: actions/upload-artifact@v4
        with:
          name: loader-payload
          path: vita-baremetal-linux-loader/vita-baremetal-linux-loader.bin
          if-no-files-found: error
          retention-days: 14

  guard-deploy-paths:
    name: Guard deploy paths
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Refuse deploys to the inert baremetal path
        run: |
          # ux0:/baremetal/payload.bin is inert on DvaMishkiLapa-family kplugins.
          # A deploy there silently does nothing: every launch runs whatever payload
          # was already on the card, which reads as "the device hangs". Catch any
          # new code that reintroduces it as a *destination*.
          echo "scanning for deploys to the inert path..."
          hits=$(grep -rn --include='*.py' --include='*.sh' --include='Makefile' \
                   -E '(STOR|curl[^|]*-T|ftp|/ux0:/baremetal)' . \
                 | grep -E '(STOR|curl)' \
                 | grep 'baremetal' || true)
          if [ -n "$hits" ]; then
            echo "::error::code deploys to ux0:/baremetal, which is inert on this device family"
            echo "$hits"
            exit 1
          fi
          echo "ok: no deploys to the inert path"

      - name: Gate tooling must at least import
        run: |
          python3 -m py_compile tools/hardware-gate.py tools/deploy-payload.py
          echo "ok: tools compile"

      - name: Hardware gate precondition path works without a device
        run: |
          # A guard nobody exercises is a guard that quietly rots. With no device on
          # 127.0.0.1 the gate must exit 2 (precondition), not 0 or 1, and it must say
          # why. This runs no risk of touching real hardware in CI.
          set +e
          out=$(python3 tools/hardware-gate.py --payload README.md --host 127.0.0.1 2>&1)
          rc=$?
          set -e
          echo "$out"
          [ "$rc" -eq 2 ] || { echo "::error::expected exit 2 (precondition), got $rc"; exit 1; }
          echo "ok: gate refused to run without a device in VitaOS"
