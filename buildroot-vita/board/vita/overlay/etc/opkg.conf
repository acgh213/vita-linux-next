# opkg configuration for the Vita Linux workbench.
#
# There is no upstream package feed for this platform: the rootfs is built by
# Buildroot and embedded in the kernel image, so nothing publishes .ipk files
# for armv7 Vita. opkg is shipped for LOCAL installs — packages you build
# yourself or copy onto the game card — not for fetching from the internet.
#
# To install a local package:
#     opkg install /mnt/vita-card/pkgs/foo_1.0_arm.ipk
#
# To use a feed you host yourself, add a line like:
#     src/gz local file:///mnt/vita-card/pkgs
# then run: opkg update

# Destination for installs. The rootfs is a RAM initramfs, so anything
# installed to / is LOST on power cycle. Prefer the persistent workspace.
dest root /
dest workspace /mnt/workspace/opt

# State lives on the persistent workspace so an install survives a reboot
# when it targets the workspace destination.
lists_dir ext /var/lib/opkg/lists

# A local file feed on the game card. Harmless when the directory is absent:
# opkg update simply reports it cannot read it.
src/gz card file:///mnt/vita-card/pkgs

option overlay_root /mnt/workspace/opt
